<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tienvarsi: fuel, charging, parking and car washes in Finland</title>
<meta name="description" content="Community map of fuel prices, EV charging, free and cheap parking, car washes and drive-throughs across Finland.">
<meta name="theme-color" content="#1452A8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231452A8'/%3E%3Crect x='2.5' y='2.5' width='27' height='27' rx='5' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3Cpath d='M9 26 13.5 6M23 26 18.5 6' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M16 24v-3M16 17.5v-2.5M16 11.5V10' stroke='%23FFC93C' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
:root{
  --ink:#18202A; --ink-2:#4B5663; --ink-3:#7A8592;
  --frost:#EEF2F6; --panel:#FFFFFF; --line:#D9E0E7;
  --sign:#1452A8; --lane:#FFC93C; --danger:#C8233A;
  --fuel:#EE8A00; --ev:#13A06B; --park:#1452A8; --wash:#0A93B8; --drive:#B03A7F;
  --free:#13A06B; --disc:#1452A8; --paid:#7D8896; --cond:#B98900;
  --plate-ink:#121820;
  --shadow-s:0 1px 2px rgba(16,32,52,.14),0 4px 14px rgba(16,32,52,.14);
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond-f:'Barlow Condensed','Barlow',system-ui,sans-serif;
  --peek:calc(196px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme:dark){
  :root{--ink:#E8EDF2;--ink-2:#B3BDC8;--ink-3:#8692A0;--frost:#1C232C;--panel:#131920;--line:#2A333E;
    --shadow-s:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.45;color:var(--ink);background:#E6EAEE;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--sign)}
@media (prefers-color-scheme:dark){a{color:#7EB0F5}}
:focus-visible{outline:3px solid var(--lane);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#map{position:fixed;inset:0;z-index:0;background:#E6EAEE}
.leaflet-container{font-family:var(--font);background:#E6EAEE}
.leaflet-control-attribution{font-size:10.5px;line-height:1.35;max-width:calc(100vw - 70px);background:rgba(255,255,255,.82)!important;border-radius:6px 0 0 0}
.leaflet-bottom{bottom:var(--peek)}
.leaflet-control-zoom{display:none}

/* Header: brand sign, search, language, service signs */
.top{position:fixed;z-index:500;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:grid;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.bar{display:flex;gap:8px;align-items:center;min-width:0}
.brand{flex:none;display:flex;align-items:center;gap:7px;height:44px;padding:0 11px;border-radius:8px;background:var(--sign);color:#fff;text-decoration:none;
  box-shadow:inset 0 0 0 3px var(--sign),inset 0 0 0 4.6px #fff,var(--shadow-s);font:700 22px/1 var(--cond-f)}
.brand svg{width:22px;height:22px}
.brand span{display:none}
@media (min-width:480px){.brand span{display:inline}}
.search{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:44px;padding:0 6px 0 12px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow-s)}
.search>svg{color:var(--ink-3)}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--ink);font:500 16px var(--font)}
.search input::placeholder{color:var(--ink-3)}
.results{position:absolute;top:50px;left:0;right:0;margin:0;padding:6px;list-style:none;background:var(--panel);border-radius:12px;box-shadow:var(--shadow-s);max-height:50vh;overflow:auto}
.results button{width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:8px;display:block}
.results button:hover{background:var(--frost)}
.results .r1{font-weight:600;display:block}
.results .r2{font-size:13px;color:var(--ink-3)}
.results p{margin:8px 10px;color:var(--ink-2)}
.lang{flex:none;display:flex;gap:2px;height:44px;padding:4px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow-s)}
.lang button{border:0;background:none;border-radius:8px;padding:0 8px;font:600 14px var(--cond-f);letter-spacing:.04em;color:var(--ink-2)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--panel)}

.signs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 2px 8px;margin:0 -2px}
.signs::-webkit-scrollbar{display:none}
.sign{flex:none;display:flex;align-items:center;gap:0;height:46px;padding:4px;border:0;border-radius:10px;background:var(--panel);box-shadow:var(--shadow-s);font:600 15px var(--font);transition:background .2s,color .2s}
.sq{flex:none;width:38px;height:38px;border-radius:6px;display:grid;place-items:center;color:#fff;background:var(--sign);
  box-shadow:inset 0 0 0 2.2px var(--sign),inset 0 0 0 3.6px #fff}
.sq svg{width:22px;height:22px}
.sq.cc{background:var(--c);box-shadow:inset 0 0 0 2.2px var(--c),inset 0 0 0 3.6px #fff}
.pfee{background:var(--fc);box-shadow:inset 0 0 0 2.2px var(--fc),inset 0 0 0 3.6px #fff}
.pfee.fee-unknown{color:var(--sign);box-shadow:inset 0 0 0 2.2px var(--sign)}
[data-drag]{touch-action:none}
.sign .lbl{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .28s ease,padding .28s ease}
.sign[aria-selected=true]{background:var(--ink);color:var(--panel)}
.sign[aria-selected=true] .sq{background:var(--c);box-shadow:inset 0 0 0 2.2px var(--c),inset 0 0 0 3.6px #fff}
.sign[aria-selected=true] .lbl{max-width:160px;padding:0 10px 0 10px}

/* Floating buttons */
.fabs{position:fixed;z-index:550;right:12px;bottom:calc(var(--peek) + 14px);display:grid;gap:8px;transition:opacity .2s}
.fab{width:46px;height:46px;border:0;border-radius:12px;display:grid;place-items:center;background:var(--panel);color:var(--ink);box-shadow:var(--shadow-s)}
.fab.add{background:var(--sign);color:#fff;box-shadow:inset 0 0 0 2.2px var(--sign),inset 0 0 0 3.6px #fff,var(--shadow-s)}
body.sheet-up .fabs{opacity:0;pointer-events:none}

/* Bottom sheet */
.sheet{position:fixed;z-index:600;left:0;right:0;bottom:0;height:calc(100dvh - 128px - env(safe-area-inset-top));display:flex;flex-direction:column;background:var(--panel);border-radius:22px 22px 0 0;
  box-shadow:0 -6px 28px rgba(16,32,52,.18);transform:translateY(calc(100% - var(--peek)));transition:transform .34s cubic-bezier(.2,.8,.2,1);touch-action:none}
.sheet.half{transform:translateY(calc(100% - 56dvh))}
.sheet.half .sh-body{padding-bottom:calc(44dvh - 104px - env(safe-area-inset-top) + env(safe-area-inset-bottom))}
.sheet.full{transform:translateY(0)}
.sheet.dragging{transition:none}
.handle{flex:none;height:26px;display:grid;place-items:center;cursor:grab;border:0;background:none;width:100%}
.handle span{width:44px;height:5px;border-radius:3px;background:var(--line)}
.sh-body{flex:1;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:calc(24px + env(safe-area-inset-bottom))}

.sh-head{padding:0 18px 10px}
.sh-title{display:flex;align-items:center;gap:10px;min-height:40px}
.sh-title .sq{width:34px;height:34px}
.sh-title .sq svg{width:20px;height:20px}
.sh-title h2{margin:0;font:600 26px/1.05 var(--cond-f);letter-spacing:.005em}
.count{font:600 16px var(--cond-f);color:var(--ink-3)}
.ctl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -18px 0;padding:0 18px}
.ctl::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink-2);font:600 14px var(--font);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chip .dot{width:9px;height:9px;border-radius:2px;background:var(--c)}
.ctl .gap{flex:none;width:10px}
.status{margin:0 18px 8px;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status .linkbtn{border:0;background:none;color:var(--sign);font-weight:600;padding:0;text-decoration:underline}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--sign);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.rows{list-style:none;margin:0;padding:0 8px}
.row{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px;border:0;border-radius:12px;background:none;text-align:left}
.row:hover{background:var(--frost)}
.row .sq{width:34px;height:34px}
.row .sq svg{width:19px;height:19px}
.row .nm{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{display:flex;gap:12px;font-size:13.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.row .val{font:600 15px var(--cond-f);color:var(--ink-2);text-align:right}
.row .val.muted{font:500 13px var(--font);color:var(--ink-3)}
.sqP{font:700 21px/1 var(--cond-f)}

/* Number-plate price chip */
.plate{display:inline-flex;align-items:stretch;height:24px;background:#fff;border:1.6px solid var(--plate-ink);border-radius:4px;overflow:hidden;
  font:600 15px/1 var(--cond-f);color:var(--plate-ink);font-variant-numeric:tabular-nums;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.plate::before{content:'';width:7px;flex:none;background:radial-gradient(circle at 50% 32%,#FFD400 0 1.3px,transparent 1.8px),#1D4CB2}
.plate>span{display:flex;align-items:center;padding:0 6px 0 5px;letter-spacing:.02em}
.plate.cheap{background:var(--lane)}
.plate.stale>span{color:#6E7884}
.plate.lg{height:32px;font-size:20px;border-width:2px}
.plate.lg::before{width:9px}
.plate.none{border-style:dashed;border-color:#9AA4AF;box-shadow:none}
.plate.none>span{color:#8A94A0;font-weight:500}

/* Map markers */
.mk{width:0!important;height:0!important;background:none;border:0}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);transition:transform .15s}
.pin-dot{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;background:var(--c);
  box-shadow:inset 0 0 0 2px var(--c),inset 0 0 0 3.2px rgba(255,255,255,.95),0 2px 6px rgba(16,32,52,.35)}
.pin-dot svg{width:18px;height:18px}
.pin.dim{opacity:.55}
.pin-tag{position:absolute;left:50%;top:calc(100% + 2px);transform:translateX(-50%);padding:2px 4px;border-radius:3px;background:#fff;color:var(--plate-ink);font:700 11px/1 var(--cond-f);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pin-plate{transform:translate(-50%,calc(-100% - 7px));filter:drop-shadow(0 2px 4px rgba(16,32,52,.35))}
.pin-plate::after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:6px solid transparent;border-bottom:0;border-top:7px solid var(--plate-ink)}
.pin-p{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#fff;font:700 19px/1 var(--cond-f);background:var(--fc);
  box-shadow:inset 0 0 0 2px var(--fc),inset 0 0 0 3.2px rgba(255,255,255,.95),0 2px 6px rgba(16,32,52,.35)}
.fee-free{--fc:var(--free)}.fee-disc{--fc:var(--disc)}.fee-paid{--fc:var(--paid)}.fee-cond{--fc:var(--cond)}
.fee-unknown{--fc:#fff}
.pin-p.fee-unknown{color:var(--sign);box-shadow:inset 0 0 0 2px var(--sign),0 2px 6px rgba(16,32,52,.35)}
.pin.sel{transform:translate(-50%,-50%) scale(1.28);z-index:2}
.pin-plate.sel{transform:translate(-50%,calc(-100% - 7px)) scale(1.18);transform-origin:50% 130%}
.pin.user::before{content:'';position:absolute;inset:-4px;border:2px dashed var(--c,var(--sign));border-radius:10px}
.pin-cl{display:flex;align-items:center;gap:5px;transform:translate(-50%,-50%)}
.pin-cl b{min-width:32px;height:32px;padding:0 7px;border-radius:16px;display:grid;place-items:center;color:#fff;font:700 15px/1 var(--cond-f);background:var(--c);
  box-shadow:0 0 0 3px rgba(255,255,255,.9),0 2px 8px rgba(16,32,52,.35)}
.pin-cl .plate{height:22px;font-size:13px;box-shadow:0 2px 6px rgba(16,32,52,.3)}
.me-dot{width:18px;height:18px;border-radius:50%;background:#1A6FE0;box-shadow:0 0 0 3px #fff,0 0 0 9px rgba(26,111,224,.22)}
.drop{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:translate(-50%,-115%) rotate(-45deg);background:var(--ink);box-shadow:0 0 0 3px #fff,0 3px 8px rgba(0,0,0,.35)}
.placing-pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:translate(-50%,-115%) rotate(-45deg);background:var(--lane);box-shadow:0 0 0 3px var(--plate-ink),0 4px 10px rgba(0,0,0,.4)}

/* Detail */
.dt-top{display:flex;justify-content:space-between;align-items:center;padding:0 10px 4px}
.ghost{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--ink-2);font-weight:600}
.ghost:hover{background:var(--frost)}
.dt-name{margin:0 18px;font:600 30px/1.05 var(--cond-f);letter-spacing:.005em}
.dt-sub{margin:6px 18px 0;color:var(--ink-2)}
.dt-badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 18px 0}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;font-weight:600;font-size:13.5px;background:var(--frost);color:var(--ink-2)}
.badge.fee{color:#fff;background:var(--fc)}
.badge.fee-unknown{color:var(--ink-2);background:var(--frost)}
.notice{margin:14px 18px 0;padding:12px 14px;border-radius:12px;background:#FFF4D6;color:#5B4300;font-size:14px;border-left:4px solid var(--lane)}
@media (prefers-color-scheme:dark){.notice{background:#3A3013;color:#F7E3A6}}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 18px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:600 15px var(--font);text-decoration:none}
.actions>.btn{flex:1 1 auto}
.btn.primary{border:0;background:var(--sign);color:#fff;box-shadow:inset 0 0 0 2.2px var(--sign),inset 0 0 0 3.6px rgba(255,255,255,.92)}
.btn[disabled]{opacity:.6;cursor:default}
.sec{margin:22px 18px 0}
.sec h3{margin:0 0 10px;font:600 19px/1.2 var(--cond-f)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14.5px}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;overflow-wrap:anywhere}
.board{display:grid;grid-template-columns:auto auto 1fr;gap:10px 14px;align-items:center;margin:16px 18px 0;padding:14px 16px;border-radius:14px;background:var(--frost)}
.board .ft{font-weight:600}
.board .age{font-size:13px;color:var(--ink-3)}
.sockets{display:flex;flex-wrap:wrap;gap:8px}
.socket{display:flex;align-items:baseline;gap:8px;padding:8px 12px;border-radius:10px;background:var(--frost)}
.socket b{font:600 17px var(--cond-f)}
.socket span{font-size:13px;color:var(--ink-3)}

/* Parking disc */
.disc{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;margin:16px 18px 0;padding:14px;border-radius:16px;background:var(--frost)}
.disc svg{width:132px;height:132px;display:block}
.disc .hand{transform-origin:112px 108px;transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
.disc .set{font:600 15px var(--font);color:var(--ink-2);margin:0}
.disc .time{font:700 44px/1 var(--cond-f);color:var(--ink);margin:2px 0 6px;font-variant-numeric:tabular-nums}
.disc .small{font-size:13.5px;color:var(--ink-2);margin:0}
@media (prefers-reduced-motion:reduce){.disc .hand,.sign,.sign .lbl,.sheet,.pin{transition:none}}

/* Reports */
.reps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rep{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line)}
.rep.low{opacity:.55}
.kvs{display:flex;flex-wrap:wrap;gap:6px 14px}
.kv{font-size:14.5px}
.kv i{font-style:normal;color:var(--ink-3);margin-right:5px}
.kv b{font:600 16px var(--cond-f);font-variant-numeric:tabular-nums}
.rep-note{margin:6px 0 0;font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.rep-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--ink-3)}
.votes{display:flex;gap:6px}
.vote{height:32px;padding:0 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);font:600 13px var(--font);color:var(--ink-2)}
.vote[aria-pressed=true]{border-color:var(--ink);color:var(--ink)}
.vote b{font-family:var(--cond-f);margin-left:3px}
.empty{color:var(--ink-3);font-size:14px;margin:0}
.src{margin:22px 18px 0;font-size:13px;color:var(--ink-3)}

/* Offers */
.offer{margin:0 18px 12px;padding:14px 16px;border-radius:14px;background:var(--frost);border-left:5px solid var(--c)}
.of-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.of-brand{font:700 15px var(--cond-f);letter-spacing:.02em;color:var(--ink-2)}
.of-cats{display:flex;gap:4px}
.of-cats .sq,.of-cats .sq.cc{width:22px;height:22px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--c),inset 0 0 0 2.4px #fff}
.of-cats .sq svg{width:13px;height:13px}
.offer h4{margin:6px 0 4px;font:600 19px/1.2 var(--cond-f)}
.offer p{margin:0;font-size:14.5px;color:var(--ink-2)}
.offer .of-meta{margin-top:8px;font-size:13px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap}
.lead{margin:6px 18px 0;color:var(--ink-2);font-size:14.5px;max-width:60ch}
.sub-h{margin:24px 18px 10px;font:600 20px var(--cond-f)}

/* Forms */
.form{display:grid;gap:14px;padding:6px 18px 8px}
.form h2{margin:0;font:600 26px/1.1 var(--cond-f)}
.form .for{margin:-8px 0 0;color:var(--ink-2)}
.fld label,.fld .lb{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
.fld .opt{font-weight:500;color:var(--ink-3)}
.fld input,.fld select,.fld textarea{width:100%;height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:500 16px var(--font)}
.fld textarea{height:84px;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--sign);box-shadow:0 0 0 3px rgba(20,82,168,.18)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{position:relative}
.pick input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pick span{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2)}
.pick input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.pick input:focus-visible+span{outline:3px solid var(--lane);outline-offset:2px}
.hint{margin:0;font-size:13px;color:var(--ink-3)}
.hp{position:absolute;left:-9999px}
.form .actions{margin:4px 0 0}

/* Toast + placing bar */
.toast{position:fixed;z-index:900;left:50%;bottom:calc(var(--peek) + 18px);transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:min(92vw,420px);padding:12px 16px;border-radius:12px;background:var(--plate-ink);color:#fff;font-weight:600;font-size:14.5px;box-shadow:var(--shadow-s);transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.placing{position:fixed;z-index:800;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow-s)}
.placing p{margin:0;font-weight:600}
.placing .actions{margin:0}
body.placing-on .sheet,body.placing-on .fabs{visibility:hidden}

/* Desktop: sheet becomes a left column */
@media (min-width:920px){
  :root{--peek:0px}
  .top{right:auto;width:440px;padding:16px 16px 0}
  .signs{display:grid;grid-template-columns:repeat(5,1fr);overflow:visible;padding-bottom:0}
  .sign{flex-direction:column;height:auto;gap:6px;padding:8px 4px 8px;font-size:13.5px}
  .sign .lbl,.sign[aria-selected=true] .lbl{max-width:none;padding:0}
  .sheet{left:16px;right:auto;top:auto;bottom:16px;width:408px;height:calc(100dvh - 186px);border-radius:20px;transform:none!important;box-shadow:var(--shadow-s)}
  .handle{display:none}
  .sheet.half .sh-body{padding-bottom:24px}
  .sh-body{padding-top:14px}
  .fabs{bottom:24px;right:16px}
  body.sheet-up .fabs{opacity:1;pointer-events:auto}
  .leaflet-bottom{bottom:0}
  .leaflet-control-zoom{display:block}
  .toast{left:calc(50% + 220px);bottom:28px}
  .lang{position:fixed;top:16px;right:56px}
  .placing{left:auto;right:80px;bottom:24px;width:380px}
  body.placing-on .sheet{visibility:visible}
}

function addOsm(el, cat){

async function loadOverpass(cat, b){

  const q = `[out:json][timeout:25];${OQ[cat](bboxStr(b))}out center tags qt;`;
  for (const url of CONFIG.OVERPASS) {
    try {
      const res = await fetch(url, {method:'POST', body:'data=' + encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}, signal: ac.signal});
      if (!res.ok) throw new Error('HTTP ' + res.status);

      if (!p.cats.has(c) || p.src === 'hel' || !b.contains([p.lat, p.lon]) || !passFilter(p)) continue;

      const m = L.marker([p.lat, p.lon], {icon: L.divIcon({className:'mk', html, iconSize:null}), title: placeName(p), price, zIndexOffset: p.key === S.selected ? 1000 : (p.key === S.cheapKey ? 500 : 0)});
      m.on('click', () => openPlace(p.key, false));
      markers.set(p.key, m); list.push(m);
    }
    cluster.addLayers(list); map.addLayer(cluster);
  }

}
function renderHel(){
  if (helLayer) { map.removeLayer(helLayer); helLayer = null; }
  if (S.cat !== 'parking' || map.getZoom() < 15) return;
  const b = map.getBounds().pad(.3), layers = [];
  for (const p of S.places.values()) {
    if (p.src !== 'hel' || !b.contains([p.lat, p.lon]) || !passFilter(p)) continue;
    const col = FEE_COLORS[parkingInfo(p).fee], sel = p.key === S.selected;
    const g = L.geoJSON(p.geom, {renderer: helRenderer, style:{color: sel ? '#121820' : col, weight: sel ? 6 : 4, opacity:.95, fillColor: col, fillOpacity:.35}});
    g.on('click', e => { L.DomEvent.stopPropagation(e); openPlace(p.key, false); });
    layers.push(g);
  }
  helLayer = L.layerGroup(layers).addTo(map);
}

function visiblePlaces(){

  for (const p of S.places.values()) { if (!p.cats.has(S.cat) || !b.contains([p.lat, p.lon]) || !passFilter(p)) continue; p._d = dist(ref, p); arr.push(p); }

/* Parking disc */
function discTimes(){
  const now = new Date(), set = new Date(now); set.setSeconds(0, 0);
  const m = set.getMinutes(); if (m < 30) set.setMinutes(30); else { set.setMinutes(0); set.setHours(set.getHours() + 1); }
  return {now, set};
}
function discHtml(maxH){
  const {now, set} = discTimes();
  const angle = ((set.getHours() % 12) + set.getMinutes()/60) * 30;
  const ticks = []; for (let i = 0; i < 24; i++) { const a = i * 15 * Math.PI/180, r1 = i % 2 ? 56 : 50, r2 = 61; ticks.push(`<line x1="${112 + r1*Math.sin(a)}" y1="${108 - r1*Math.cos(a)}" x2="${112 + r2*Math.sin(a)}" y2="${108 - r2*Math.cos(a)}" stroke="#1452A8" stroke-width="${i % 2 ? 1.6 : 3}" stroke-linecap="round"/>`); }
  const nums = [[12,0],[3,90],[6,180],[9,270]].map(([n, d]) => { const a = d*Math.PI/180; return `<text x="${112 + 38*Math.sin(a)}" y="${108 - 38*Math.cos(a) + 6}" text-anchor="middle" font-family="Barlow Condensed,Barlow,sans-serif" font-weight="700" font-size="17" fill="#1452A8">${n}</text>`; }).join('');
  const leave = maxH ? new Date(set.getTime() + maxH*3600000) : null;
  return `<div class="disc">
    <svg viewBox="0 0 200 200" role="img" aria-label="${esc(t('disc_set'))} ${fmtClock(set)}">
      <rect x="3" y="3" width="194" height="194" rx="20" fill="#1452A8"/><rect x="10" y="10" width="180" height="180" rx="14" fill="none" stroke="#fff" stroke-width="3.5"/>
      <text x="24" y="54" fill="#fff" font-family="Barlow Condensed,Barlow,sans-serif" font-weight="700" font-size="40">P</text>
      <circle cx="112" cy="108" r="66" fill="#fff"/>${ticks.join('')}${nums}
      <g class="hand" style="transform:rotate(${reduced ? angle : 0}deg)" data-angle="${angle}"><path d="M112 108 L112 52" stroke="#121820" stroke-width="5" stroke-linecap="round"/><path d="M104 60 L112 44 L120 60 Z" fill="#121820"/></g>
      <circle cx="112" cy="108" r="7" fill="#FFC93C" stroke="#121820" stroke-width="2.5"/>
    </svg>
    <div><p class="set">${t('disc_set')}</p><p class="time">${fmtClock(set)}</p>
    <p class="small">${t('disc_arrived', {t: fmtClock(now)})}</p>${leave ? `<p class="small"><b>${t('disc_leave', {t: fmtClock(leave)})}</b></p>` : ''}</div>
  </div><p class="lead" style="font-size:13.5px">${t('disc_rule')} ${t('check_signs')}</p>`;
}

function repValues(r){

/* ---------------- Sheet position ---------------- */
const sheetEl = $('#sheet');
function setSheet(state){
  S.sheet = state;
  sheetEl.classList.remove('peek', 'half', 'full'); sheetEl.classList.add(state);
  document.body.classList.toggle('sheet-up', state !== 'peek');
  $('#handle').setAttribute('aria-expanded', String(state !== 'peek'));
}
(() => {
  let start = null;
  const peekPx = () => { const el = document.createElement('div'); el.style.cssText = 'position:absolute;height:var(--peek)'; document.body.appendChild(el); const h = el.offsetHeight; el.remove(); return h; };
  sheetEl.addEventListener('pointerdown', e => {
    if (isDesktop()) return;
    const zone = e.target.closest('#handle,[data-drag]'); if (!zone) return;
    const H = sheetEl.offsetHeight, pos = {peek: H - peekPx(), half: H - innerHeight*.56, full: 0};
    start = {y: e.clientY, base: pos[S.sheet], pos, moved: false, id: e.pointerId};
  });
  addEventListener('pointermove', e => {
    if (!start || e.pointerId !== start.id) return;
    const dy = e.clientY - start.y;
    if (!start.moved && Math.abs(dy) < 7) return;
    if (!start.moved) { start.moved = true; sheetEl.classList.add('dragging'); }
    const y = Math.max(0, Math.min(start.pos.peek, start.base + dy));
    sheetEl.style.transform = `translateY(${y}px)`;
  });
  addEventListener('pointerup', e => {
    if (!start || e.pointerId !== start.id) return;
    const s = start; start = null;
    if (!s.moved) { if (s && e.target.closest('#handle')) setSheet(S.sheet === 'peek' ? 'half' : S.sheet === 'half' ? 'full' : 'peek'); return; }
    sheetEl.classList.remove('dragging');
    const y = Math.max(0, Math.min(s.pos.peek, s.base + (e.clientY - s.y)));
    const near = Object.entries(s.pos).sort((a, b) => Math.abs(a[1] - y) - Math.abs(b[1] - y))[0][0];
    sheetEl.style.transform = ''; setSheet(near);
  });
  addEventListener('pointercancel', () => { if (start) { start = null; sheetEl.classList.remove('dragging'); sheetEl.style.transform = ''; } });
})();

async function vote(id, value){

  try {

    const o = S.votes.get(id) || {up:0, down:0}; if (value > 0) o.up++; else o.down++; S.votes.set(id, o);
    S.myVotes[id] = value; LS.set('tv_myvotes', S.myVotes); toast(t('voted')); renderAll();
  } catch(err) {
    if (err.code === '23505') { S.myVotes[id] = value; LS.set('tv_myvotes', S.myVotes); toast(t('already')); renderSheet(); }
    else toast(t('err_save'));
  }
}
function readNum(fd, k, min, max, label){
  const raw = (fd.get(k) || '').toString().trim(); if (!raw) return {v: null};
  const v = num(raw); if (v == null || v < min || v > max) return {err: t('err_range', {f: label})};
  return {v};
}
async function submitForm(form){
  const fd = new FormData(form); if (fd.get('website')) return;
  const v = S.view, btn = form.querySelector('[type=submit]');
  const fail = msg => { toast(msg); };
  let row;
  if (v.kind === 'offer') {
    const brand = (fd.get('brand') || '').toString().trim(), title = (fd.get('title') || '').toString().trim(), url = (fd.get('url') || '').toString().trim();
    if (!brand || !title) return fail(t('err_offer'));
    if (url && !/^https:\/\//i.test(url)) return fail(t('err_url'));
    const data = {brand: brand.slice(0, 60), title: title.slice(0, 120), cat: fd.get('cat') || 'fuel'};
    const detail = (fd.get('detail') || '').toString().trim(); if (detail) data.detail = detail.slice(0, 400);
    const vu = fd.get('valid_until'); if (vu) data.valid_until = vu;
    if (url) data.url = url.slice(0, 300);
    row = {category:'offer', place_key:'offer:' + brand.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40), place_name: brand.slice(0, 120), lat:null, lon:null, data, note:null, client_id: CID, lang};
  } else {
    const p = v.key ? S.places.get(v.key) : null, c = v.cat, data = {};
    if (!p) { const name = (fd.get('name') || '').toString().trim(); if (!name) return fail(t('err_name')); data.name = name.slice(0, 80); }
    let r;
    if (c === 'fuel') {
      let any = false;
      for (const f of FUELS) { if (!fd.has(f.k)) continue; r = readNum(fd, f.k, .5, 4.5, fuelLabel(f)); if (r.err) return fail(r.err); if (r.v != null) { data[f.k] = Math.round(r.v*1000)/1000; any = true; } }
      if (!any && p) return fail(t('err_price'));
    } else if (c === 'ev') {
      if (fd.get('status')) data.status = fd.get('status');
      for (const [k, mx, lb] of [['price_kwh', 2, t('price_kwh')], ['price_min', 2, t('price_min')], ['start_fee', 10, t('start_fee')], ['max_kw', 1000, t('max_kw')]]) { r = readNum(fd, k, 0, mx, lb); if (r.err) return fail(r.err); if (r.v != null) data[k] = r.v; }
      const op = (fd.get('operator') || '').toString().trim(); if (op) data.operator = op.slice(0, 60);
    } else if (c === 'parking') {
      if (fd.get('fee')) data.fee = fd.get('fee');
      r = readNum(fd, 'price_h', 0, 30, t('price_h')); if (r.err) return fail(r.err); if (r.v != null) data.price_h = r.v;
      r = readNum(fd, 'max_h', 0, 72, t('max_h')); if (r.err) return fail(r.err); if (r.v != null) data.max_h = r.v;
    } else if (c === 'wash') {
      const types = fd.getAll('types'); if (types.length) data.types = types;
      r = readNum(fd, 'price', 0, 300, t('wash_price')); if (r.err) return fail(r.err); if (r.v != null) data.price = r.v;
      const bn = (fd.get('benefit') || '').toString().trim(); if (bn) data.benefit = bn.slice(0, 160);
    } else if (c === 'drive') { if (fd.get('drive')) data.drive = fd.get('drive'); }
    const note = (fd.get('note') || '').toString().trim();
    if (p && Object.keys(data).length === 0 && !note) return fail(t('err_empty'));
    const pos = p ? {lat: p.lat, lon: p.lon} : v.newPlace;
    row = {category: c, place_key: p ? p.key : 'user:' + uuid(), place_name: (p ? placeName(p) : data.name).slice(0, 120), lat: +pos.lat.toFixed(6), lon: +pos.lon.toFixed(6), data, note: note ? note.slice(0, 500) : null, client_id: CID, lang};
  }
  btn.disabled = true; btn.textContent = t('saving');
  try {
    const saved = await store.add(row);
    ingestReports([saved]);
    if (row.category === 'offer') { toast(t('offer_saved')); S.view = {type:'offers'}; }
    else { toast(t('saved')); if (row.category !== S.cat) { S.cat = row.category; renderSigns(); } S.selected = row.place_key; S.view = {type:'detail', key: row.place_key}; }
    body.innerHTML = ''; renderAll(); body.scrollTop = 0; setSheet('half');
  } catch(err) {
    btn.disabled = false; btn.textContent = t('save');
    toast(/rate_limited/.test(err.message || '') ? t('err_rate') : t('err_save'));
  }
}

addEventListener('hashchange', () => {
  const m = location.hash.match(/^#(fuel|ev|parking|wash|drive)\/(\d+(?:\.\d+)?)\/(-?\d+\.\d+)\/(-?\d+\.\d+)/); if (!m) return;
  if (m[1] !== S.cat) { S.cat = m[1]; S.selected = null; S.view = {type:'list'}; renderSigns(); }
  map.setView([+m[3], +m[4]], +m[2]); renderAll();
});

/* Start */
map.on('moveend', debounce(refresh, 350));
applyI18n();
addBasemap();
store.offers().then(async rows => { ingestReports(rows); const ids = rows.map(r => r.id); if (ids.length) { const v = await store.votes(ids); for (const [id, o] of Object.entries(v)) S.votes.set(id, o); } if (S.view.type === 'offers') renderSheet(); }).catch(() => {});
refresh();
setInterval(() => { if (S.view.type === 'detail' && body.querySelector('.disc')) { const st = body.scrollTop; renderSheet(false); body.scrollTop = st; } }, 60000);
})();
</script>
</body>
</html>
